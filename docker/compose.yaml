services:
  seq:
    image: datalust/seq:2024.3
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data

  gft-test-ubs:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: gft-test-ubs:local
    depends_on:
      - seq
    environment:
      SEQ_URL: http://seq
      INPUT_FILE: /data/input.txt
      TRACING_ID: ${TRACING_ID:-}
    volumes:
      - ../Data:/data:ro
    entrypoint: ["sh", "-c"]
    command: ["dotnet GFT_test_UBS.Interface.dll < /data/input.txt"]

volumes:
  seq-data:
